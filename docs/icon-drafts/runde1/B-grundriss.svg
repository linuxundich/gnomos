<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Grundriss: Wände + 4-px-Profil -->
  <rect x="12" y="24" width="104" height="88" rx="8" fill="#3d3846"/>
  <rect x="12" y="20" width="104" height="88" rx="8" fill="#5e5c64"/>
  <!-- Drei Räume -->
  <rect x="16" y="24" width="46" height="80" rx="4" fill="#99c1f1"/>
  <rect x="66" y="24" width="46" height="38" rx="4" fill="#8ff0a4"/>
  <rect x="66" y="66" width="46" height="38" rx="4" fill="#ffbe6f"/>
  <!-- Türen -->
  <rect x="62" y="38" width="4" height="10" fill="#99c1f1"/>
  <rect x="62" y="80" width="4" height="10" fill="#99c1f1"/>
  <!-- In jedem Raum ein Lautsprecher, der im Takt spielt -->
  <g fill="none" stroke-width="4">
    <circle cx="39" cy="64" r="18" stroke="#3584e4" opacity="0.5"/>
    <circle cx="39" cy="64" r="11" stroke="#3584e4"/>
    <circle cx="89" cy="43" r="13" stroke="#26a269" opacity="0.5"/>
    <circle cx="89" cy="43" r="7" stroke="#26a269"/>
    <circle cx="89" cy="85" r="13" stroke="#e66100" opacity="0.5"/>
    <circle cx="89" cy="85" r="7" stroke="#e66100"/>
  </g>
  <circle cx="39" cy="64" r="5" fill="#241f31"/>
  <circle cx="89" cy="43" r="3" fill="#241f31"/>
  <circle cx="89" cy="85" r="3" fill="#241f31"/>
</svg>
