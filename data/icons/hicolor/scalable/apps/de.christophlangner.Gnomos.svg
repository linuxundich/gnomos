<?xml version="1.0" encoding="UTF-8"?>
<!-- Gnomos application icon. Shape borrowed from GNOME Decibels' own icon
     template (a rounded play-triangle silhouette) — it reads as a play
     button already, so no separate triangle glyph was needed inside it.
     Colors from the Sonos wordmark (pure black/white, no gradients).
     The three nested arcs read as streaming/broadcast waves radiating from
     the play shape, for "a streaming music player" specifically rather
     than a generic media player. -->
